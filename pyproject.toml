[project]
name = "akie"
version = "0.0.0"
description = "A small local store for API keys."
readme = "README.md"
authors = [
    { name = "Jonghyun Park", email = "parjong@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
akie = "akie._internal.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "B", "UP", "S", "PLC2701"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Unit tests of the private layers import akie._internal on purpose.
"tests/internal/**" = ["PLC2701"]
